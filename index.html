<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6b3a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Agenda do Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: uma coluna de telemóvel — cabeçalho com o dia e a lua, grelha 2×2 de botões grandes, lista do dia por baixo */
:root{
  --bg:#eef2ea; --surface:#ffffff; --ink:#1d2a1f; --muted:#5b6b5d; --line:#d3dccf;
  --leaf:#2f6b3a; --leaf-soft:#dcebd9; --sun:#c98a14; --sun-soft:#f6e9c8; --moon:#f4efd9; --shadow:#c9d3c4;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a14; --surface:#1b261d; --ink:#e6eee3; --muted:#9db0a0; --line:#2d3c30;
  --leaf:#7fc48a; --leaf-soft:#22382a; --sun:#e5b34d; --sun-soft:#3a3020; --moon:#efe8c9; --shadow:#0b100c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a14; --surface:#1b261d; --ink:#e6eee3; --muted:#9db0a0; --line:#2d3c30;
  --leaf:#7fc48a; --leaf-soft:#22382a; --sun:#e5b34d; --sun-soft:#3a3020; --moon:#efe8c9; --shadow:#0b100c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf)}
.today-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}

.day{display:flex;align-items:center;gap:16px}
.day-nav{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer;display:grid;place-items:center}
.date-box{flex:1;min-width:0;text-align:center;position:relative}
.date-box .wd{font-size:14px;color:var(--muted);text-transform:capitalize}
.date-box h1{font-size:clamp(24px,7vw,32px);font-weight:800;line-height:1.1}
.date-box input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.moon{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.moon svg{flex:none}
.moon b{display:block;font-size:15px}
.moon span{font-size:13px;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:18px;border:2px solid var(--line);
  background:var(--surface);cursor:pointer;text-align:left;min-height:118px;transition:transform .12s,border-color .12s}
.cat:active{transform:scale(.98)}
.cat svg{width:38px;height:38px;color:var(--leaf)}
.cat .lbl{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.cat .cnt{font-size:13px;color:var(--muted)}
.cat[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.panel-head{padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:24px;font-weight:800}
.panel-head p{margin:0;color:var(--muted);font-size:15px}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:12px 18px;font-size:15px;border-bottom:1px solid var(--line)}
.verdict.good{background:var(--leaf-soft)}
.verdict.meh{background:var(--sun-soft)}
.verdict .dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--sun)}
.verdict.good .dot{background:var(--leaf)}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
ul.items li:last-child{border-bottom:0}
.it-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.it-name{font-weight:700;font-size:17px}
.it-note{color:var(--muted);font-size:15px}
.chip{font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.tips{padding:14px 18px;background:var(--bg);font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tips b{color:var(--ink)}
.foot{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
@media (prefers-reduced-motion:reduce){.cat{transition:none}}
</style>
</head><body>

<div class="wrap">
  <div class="top">
    <div class="brand">Agenda do Campo</div>

  <div class="day">

  </div>

  <div class="moon" id="moon"></div>

  <div class="grid" role="group" aria-label="O que fazer">
    <button class="cat" type="button" data-k="podas" id="c-podas">

      <span class="lbl">Tratamentos</span><span class="cnt"></span>
    </button>
    <button class="cat" type="button" data-k="plantar" id="c-plantar">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 35V18M20 22c0-7-5-11-12-11 0 7 5 11 12 11ZM20 18c0-6 4-10 11-10 0 6-4 10-11 10ZM8 35h24"/></svg>
      <span class="lbl">Plantar</span><span class="cnt"></span>
    </button>
    <button class="cat" type="button" data-k="estacas" id="c-estacas">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v22M20 12l6-4M20 18l-6-4M6 28h28M14 28l-2 6M20 28v6M26 28l2 6"/></svg>
      <span class="lbl">Estaquia</span><span class="cnt"></span>
    </button>
  </div>

  <section class="panel" id="panel" aria-live="polite"></section>

  <p class="foot">Calendário para Portugal continental, com base no mês e na fase da lua (tradição popular).<br>Nas zonas frias e de altitude atrase 2 a 3 semanas; no litoral sul e Algarve pode adiantar.</p>
</div>

/* ---------- Lua ---------- */
const SYN=29.530588853, REF=Date.UTC(2000,0,6,18,14);
function moonAge(d){const t=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12);let a=((t-REF)/864e5)%SYN;return a<0?a+SYN:a}
function phase(a){
  if(a<1.85||a>=27.68) return {k:"nova",n:"Lua nova"};
  if(a<13.77) return {k:"cresc",n:a<5.5?"Lua crescente":a<9.2?"Quarto crescente":"Crescente gibosa"};
  if(a<15.77) return {k:"cheia",n:"Lua cheia"};
  return {k:"ming",n:a<20.3?"Minguante gibosa":a<24?"Quarto minguante":"Lua minguante"};
}
function moonSVG(a){
  const r=18,c=20,th=2*Math.PI*a/SYN,rx=Math.abs(Math.cos(th))*r,wax=th<Math.PI;
  const s1=wax?1:0;const gib=Math.cos(th)<0;const s2=wax?(gib?1:0):(gib?0:1);
  const p=`M${c} ${c-r}A${r} ${r} 0 0 ${s1} ${c} ${c+r}A${rx} ${r} 0 0 ${s2} ${c} ${c-r}Z`;
  return `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--line)"/><path d="${p}" fill="var(--moon)" stroke="var(--muted)" stroke-width=".6"/><circle cx="20" cy="20" r="18" fill="none" stroke="var(--muted)" stroke-width="1"/></svg>`;
}
const MOON_TXT={
  nova:"Dia de transição: a tradição aconselha descansar das sementeiras.",
  cresc:"A seiva sobe: bom para semear o que dá folha e fruto, e para estacas.",
  cheia:"Seiva no máximo: bom para folha e fruto; evitar podas.",
  ming:"A seiva desce: bom para podar e para plantar raízes, bolbos e árvores."
};

/* ---------- Conselho do dia por categoria ---------- */
const CAT={
  podas:{t:"Podas",sub:"O que podar este mês",
    v:p=>p.k==="ming"?["good","Lua minguante: dia favorável para podar. A planta perde menos seiva e rebenta com mais equilíbrio."]
       :p.k==="nova"?["good","Lua nova: dia aceitável para podar."]
       :["meh","Lua "+(p.k==="cheia"?"cheia":"crescente")+": a tradição prefere podar em lua minguante. Se puder, espere uns dias."],
    tips:"<b>Antes de podar:</b> evite dias de chuva e de geada; desinfete a tesoura entre plantas doentes; faça cortes limpos e inclinados acima de um gomo."},
  trat:{t:"Tratamentos",sub:"Plantas a vigiar e tratar este mês",
    v:()=>["good","O mais importante é o tempo: trate só sem chuva prevista para as próximas horas e sem vento."],
    tips:"<b>Regras:</b> trate de manhã cedo ou ao fim da tarde; enxofre só abaixo de 30 °C; respeite o intervalo de segurança antes de colher; use luvas, máscara e óculos; leia sempre o rótulo do produto."},
  plantar:{t:"Plantar e semear",sub:"Hortícolas e plantas para este mês",
    v:p=>p.k==="nova"?["meh","Lua nova: a tradição aconselha esperar um ou dois dias para semear."]
       :p.k==="ming"?["good","Lua minguante: dia indicado para raízes, bolbos, tubérculos e árvores."]
       :["good","Lua "+(p.k==="cheia"?"cheia":"crescente")+": dia indicado para plantas de folha, fruto e grão."],
    tips:"<b>Dica:</b> as plantas marcadas com «Hoje» são as que a tradição lunar favorece neste dia. Regue logo depois de plantar."},
  estacas:{t:"Estaquia",sub:"Plantas para multiplicar por estacas este mês",
    v:p=>p.k==="cresc"||p.k==="cheia"?["good","Lua "+(p.k==="cheia"?"cheia":"crescente")+": a tradição diz que as estacas pegam melhor com a seiva a subir."]
       :["meh","Lua "+(p.k==="nova"?"nova":"minguante")+": pode fazer estacas, mas a tradição prefere lua crescente."],
    tips:"<b>Como fazer:</b> corte abaixo de um nó, tire as folhas de baixo, enterre 2/3 em terra leve ou areia húmida, mantenha à sombra e sem secar. Hormona de enraizamento ajuda."}
};
const TIPO={r:["raiz","ming"],f:["folha/fruto","cresc"],a:["árvore","ming"]};

/* ---------- Estado ---------- */
let day=new Date(); day.setHours(12,0,0,0);
let cur="podas";
try{const s=localStorage.getItem("agenda-cat"); if(s&&CAT[s]) cur=s}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function render(){
  const m=D[day.getMonth()], a=moonAge(day), p=phase(a);
  const isToday=iso(day)===iso(new Date());
  $("wd").textContent=(isToday?"Hoje · ":"")+day.toLocaleDateString("pt-PT",{weekday:"long"});
  $("dt").textContent=day.getDate()+" de "+MESES[day.getMonth()]+" "+(day.getFullYear()!==new Date().getFullYear()?day.getFullYear():"");
  $("pick").value=iso(day);
  $("moon").innerHTML=moonSVG(a)+`<div><b>${p.n}</b><span>${MOON_TXT[p.k]}</span></div>`;
  document.querySelectorAll(".cat").forEach(b=>{
    const k=b.dataset.k; b.setAttribute("aria-pressed",k===cur);
    const n=m[k].length; b.querySelector(".cnt").textContent=n+(k==="trat"?" a vigiar":k==="plantar"?" culturas":" plantas");
  });
  const c=CAT[cur], [vk,vt]=c.v(p);
  const items=m[cur].map(([n,note,t])=>{
    let chip="";
    if(cur==="plantar"&&t){const [lbl,ph]=TIPO[t];const fav=p.k!=="nova"&&(ph===p.k||(ph==="cresc"&&p.k==="cheia"));chip=`<span class="chip${fav?" hot":""}">${fav?"Hoje · ":""}${lbl}</span>`}
    return `<li><div class="it-top"><span class="it-name">${esc(n)}</span>${chip}</div><span class="it-note">${esc(note)}</span></li>`;
  }).join("");
  $("panel").innerHTML=`<div class="panel-head"><h2>${c.t}</h2><p>${c.sub.replace("este mês","em "+MESES[day.getMonth()])}</p></div>
    <div class="verdict ${vk}"><span class="dot"></span><span>${vt}</span></div>
    <ul class="items">${items}</ul><div class="tips">${c.tips}</div>`;
}
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{cur=b.dataset.k;try{localStorage.setItem("agenda-cat",cur)}catch(e){}render();$("panel").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})}));
$("prev").onclick=()=>{day.setDate(day.getDate()-1);render()};
$("next").onclick=()=>{day.setDate(day.getDate()+1);render()};
$("btnHoje").onclick=()=>{day=new Date();day.setHours(12,0,0,0);render()};
$("pick").addEventListener("change",e=>{if(!e.target.value)return;const [y,mo,d]=e.target.value.split("-").map(Number);day=new Date(y,mo-1,d,12);render()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();
</script>
